; MWDX Configuration
; Need for Speed: Most Wanted (2005) — selectable rendering backend
; Drop d3d9.dll + MWDX.ini into your NFS:MW game folder.
; All values take effect on game launch. Change and relaunch to update.

; ── Renderer Backend ──────────────────────────────────────────────────────────
[Renderer]
; Select the rendering backend:
;   1 = DirectX 9  — the original renderer, passed through untouched
;   2 = DirectX 11
;   3 = DirectX 12
Backend=3

; ── Translation-backend options (apply when Backend=2 or Backend=3) ─────────
; Correct the sub-pixel sampling difference between Direct3D 9 and later APIs.
HalfPixelFix=1
; Restore DX9 colour-iterator defaults so HUD sprites render correctly
LegacyColorDefault=1
; Cache translated shaders to disk for faster subsequent loads.
; Ignored while ShaderMods or ShaderDump is on, so an edited shader is never
; masked by a cached copy of the original.
ShaderDiskCache=1
; Shader editing. These two are meant to be used together - set both to 1 and
; leave them on. Play to fill MWDX\Shaders\Dumped with the shaders the game
; actually used, copy one up into MWDX\Shaders, edit it, and restart.
;
; Writes every shader MWDX generates to MWDX\Shaders\Dumped as .hlsl. Only ever
; writes the original, and only into Dumped, so it cannot overwrite your edits.
ShaderDump=0
; Loads your edited .hlsl files from MWDX\Shaders in place of the generated
; ones. Read at launch, so restart after changing a file. A file that fails to
; compile is logged and the original is used instead - a bad edit is never
; fatal.
ShaderMods=0
; Reduce input latency by limiting frame queue to 1
LowLatency=1
; Enable the graphics debug/validation layer (requires Graphics Tools; use only for testing)
DebugLayer=0
; GPU-based validation. Separate key because it is orders of magnitude slower
; than DebugLayer alone; only needed to chase shader-side out-of-bounds
; descriptor access, not for a plain "why was the device removed" run.
GpuValidation=0
; Megabytes of upload staging per frame (three frames are in flight).
; 0 = backend default. Raise this if the log reports upload-ring exhaustion.
UploadRingMB=0
; While a BeginStateBlock/EndStateBlock recording is open, add each state
; change to the block only (1, correct) or also apply it to the device (0).
StateBlockRecordOnly=1
; Diagnostic: bind every texture/sampler/state unconditionally instead of
; skipping binds the cache believes are already set. Slower; use to test
; whether a stale bind cache is causing wrong textures on screen.
NoBindCache=0
; Write the full Info/Trace diagnostic stream to MWDX-render.log, next to the exe.
; (MWDX.log is the loader's own log and always has the backend banner; the
; per-draw and per-bind translation detail goes to MWDX-render.log.) Implied by
; DebugLayer=1.
VerboseLog=0
; Periodic frame counters (including the draw funnel) in MWDX-render.log.
PerfLog=0
; Per-draw census in MWDX-render.log — one 'census#' line per draw. Independent of
; VerboseLog so a focused capture stays small. Needed to diagnose HUD/offscreen
; render-target faults (minimap, speedometer, world map).
DumpFrame=0
; How many census lines DumpFrame emits before it stops. Raise when the draws of
; interest happen late in the frame.
CensusLimit=6000
; Use borderless fullscreen instead of exclusive mode (recommended, leave as 1)
BorderlessFullscreen=1
